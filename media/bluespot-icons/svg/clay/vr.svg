<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
<title>Blue Spot — 메타버스 · XR</title>
<defs><linearGradient id="g-navy" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8796da"/><stop offset=".55" stop-color="#3D55C4"/><stop offset="1" stop-color="#3950b7"/></linearGradient><linearGradient id="g-violet" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c2b2f9"/><stop offset=".55" stop-color="#9C83F5"/><stop offset="1" stop-color="#8d78e2"/></linearGradient><linearGradient id="g-cream" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8f9ff"/><stop offset=".55" stop-color="#F3F6FF"/><stop offset="1" stop-color="#d9deeb"/></linearGradient><linearGradient id="g-sky" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#aedff8"/><stop offset=".55" stop-color="#7CCBF4"/><stop offset="1" stop-color="#70b8e1"/></linearGradient>
    
