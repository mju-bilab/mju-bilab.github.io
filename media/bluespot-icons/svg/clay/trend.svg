<g filter="url(#drop)"><g><g filter="url(#clay)"><rect x="116" y="118" width="30" height="98" rx="12" fill="url(#g-sky)"/><rect x="156" y="82" width="30" height="134" rx="12" fill="url(#g-blue)"/><rect x="196" y="40" width="30" height="176" rx="12" fill="url(#g-navy)"/></g><g filter="url(#clay-front)"><rect x="28" y="110" width="150" height="114" rx="28" fill="url(#g-cream)"/></g><g filter="url(#clay-s)"><path d="M54 196 L86 166 L112 180 L150 140" fill="none" stroke="#FF8F85" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><circle cx="150" cy="140" r="11" fill="url(#g-coral)"/></g></g></g>
