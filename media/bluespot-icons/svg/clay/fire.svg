<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
<title>Blue Spot — 핫이슈 · 화제</title>
<defs><linearGradient id="g-pink" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffc2d7"/><stop offset=".55" stop-color="#FF9DBF"/><stop offset="1" stop-color="#e48fb2"/></linearGradient><linearGradient id="g-orange" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffca90"/><stop offset=".55" stop-color="#FFAA4C"/><stop offset="1" stop-color="#e49b4d"/></linearGradient><linearGradient id="g-yellow" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe29a"/><stop offset=".55" stop-color="#FFD15C"/><stop offset="1" stop-color="#e4bd5b"/></linearGradient>
    
