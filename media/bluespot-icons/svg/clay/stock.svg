<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
<title>Blue Spot — 주식 · 증시</title>
<defs><linearGradient id="g-mint" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#99e3c9"/><stop offset=".55" stop-color="#5AD2A8"/><stop offset="1" stop-color="#52be9e"/></linearGradient><linearGradient id="g-coral" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffbab3"/><stop offset=".55" stop-color="#FF8F85"/><stop offset="1" stop-color="#e4837f"/></linearGradient><linearGradient id="g-cream" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8f9ff"/><stop offset=".55" stop-color="#F3F6FF"/><stop offset="1" stop-color="#d9deeb"/></linearGradient><linearGradient id="g-blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#99b8f5"/><stop offset=".55" stop-color="#5B8DEF"/><stop offset="1" stop-color="#5381dd"/></linearGradient>
    
    <filter id="clay" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
