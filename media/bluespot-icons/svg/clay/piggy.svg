<g filter="url(#drop)"><g><g filter="url(#clay)"><circle cx="148" cy="48" r="28" fill="url(#g-yellow)"/><rect x="70" y="176" width="28" height="46" rx="12" fill="url(#g-pink)"/><rect x="140" y="176" width="28" height="46" rx="12" fill="url(#g-pink)"/><path d="M70 104 L60 66 L104 86 Z" fill="url(#g-pink)" stroke="url(#g-pink)" stroke-width="10" stroke-linejoin="round"/></g><g filter="url(#clay-front)"><ellipse cx="122" cy="142" rx="88" ry="66" fill="url(#g-pink)"/><ellipse cx="206" cy="146" rx="20" ry="24" fill="url(#g-pink)"/></g><g filter="url(#clay-s)"><circle cx="160" cy="124" r="8" fill="url(#g-navy)"/><path d="M104 96 H140" fill="none" stroke="#3D55C4" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><circle cx="202" cy="140" r="4" fill="url(#g-navy)"/><circle cx="212" cy="152" r="4" fill="url(#g-navy)"/></g></g></g>
</svg>
