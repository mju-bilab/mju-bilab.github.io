<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
<title>Blue Spot — 리뷰 · 평점</title>
<defs><linearGradient id="g-blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#99b8f5"/><stop offset=".55" stop-color="#5B8DEF"/><stop offset="1" stop-color="#5381dd"/></linearGradient><linearGradient id="g-yellow" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe29a"/><stop offset=".55" stop-color="#FFD15C"/><stop offset="1" stop-color="#e4bd5b"/></linearGradient>
    
