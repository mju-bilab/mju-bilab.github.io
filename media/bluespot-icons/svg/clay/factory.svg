<g filter="url(#drop)"><g><g filter="url(#clay)"><circle cx="204" cy="34" r="16" fill="url(#g-sky)"/><rect x="172" y="48" width="34" height="90" rx="10" fill="url(#g-navy)"/></g><g filter="url(#clay-front)"><path d="M28 222 V118 L86 152 V118 L144 152 V100 H228 V222 Z" fill="url(#g-cream)" stroke="url(#g-cream)" stroke-width="10" stroke-linejoin="round"/></g><g filter="url(#clay-s)"><rect x="52" y="176" width="26" height="22" rx="7" fill="url(#g-orange)"/><rect x="100" y="176" width="26" height="22" rx="7" fill="url(#g-orange)"/><rect x="148" y="176" width="26" height="22" rx="7" fill="url(#g-orange)"/><rect x="192" y="176" width="20" height="22" rx="7" fill="url(#g-orange)"/></g></g></g>
