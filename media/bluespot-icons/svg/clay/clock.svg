<g filter="url(#drop)"><g><g filter="url(#clay)"><circle cx="128" cy="128" r="98" fill="url(#g-blue)"/></g><g filter="url(#clay-front)"><circle cx="128" cy="128" r="76" fill="url(#g-cream)"/></g><g filter="url(#clay-s)"><path d="M128 128 V82" fill="none" stroke="#3D55C4" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><path d="M128 128 L162 150" fill="none" stroke="#FF8F85" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><circle cx="128" cy="128" r="10" fill="url(#g-navy)"/></g></g></g>
