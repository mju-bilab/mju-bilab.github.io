<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
<title>Blue Spot — 성장 · 그린</title>
<defs><linearGradient id="g-green" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#53cda4"/><stop offset="1" stop-color="#0fa579"/></linearGradient><linearGradient id="g-mint" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6ddfb6"/><stop offset="1" stop-color="#2fbc8e"/></linearGradient>
    <linearGradient id="frost" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".7"/><stop offset=".6" stop-color="#8fe7c7" stop-opacity=".5"/><stop offset="1" stop-color="#34D399" stop-opacity=".55"/></linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".95"/><stop offset=".5" stop-color="#ffffff" stop-opacity=".35"/><stop offset="1" stop-color="#ffffff" stop-opacity=".7"/></linearGradient>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="13"/></filter>
    <filter id="drop" x="-25%" y="-25%" width="150%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="11" flood-color="#1b2f6b" flood-opacity=".2"/></filter>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0b1640" flood-opacity=".34"/></filter>
    <mask id="m" maskUnits="userSpaceOnUse" x="0" y="0" width="256" height="256"><rect x="62" y="136" width="132" height="26" rx="12" fill="#fff"/><path d="M74 162 H182 L168 224 H88 Z" fill="#fff" stroke="#fff" stroke-width="10" stroke-linejoin="round"/></mask>
    <g id="back"><path d="M128 150 V100" fill="none" stroke="#10B981" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><path d="M126 150 C126 106 98 78 52 78 C52 118 80 146 126 150 Z" fill="url(#g-mint)"/><path d="M130 150 C130 98 162 62 210 62 C210 110 174 146 130 150 Z" fill="url(#g-mint)"/></g>
  </defs>
<g filter="url(#drop)"><g>
    <use href="#back"/>
    <g mask="url(#m)"><use href="#back" filter="url(#blur)" opacity=".85"/><rect x="-64" y="-64" width="384" height="384" fill="url(#frost)"/></g>
    <rect x="62" y="136" width="132" height="26" rx="12" fill="none" stroke="url(#rim)" stroke-width="3.5"/><path d="M74 162 H182 L168 224 H88 Z" fill="none" stroke="url(#rim)" stroke-width="3.5" stroke-linejoin="round"/>
    <g filter="url(#lift)" opacity=".96"></g>
  </g></g>
</svg>
