<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
<title>Blue Spot — 인사이트 · 아이디어</title>
<defs><linearGradient id="g-yellow" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fcd161"/><stop offset="1" stop-color="#deab27"/></linearGradient>
    <linearGradient id="frost" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".7"/><stop offset=".6" stop-color="#fddc87" stop-opacity=".5"/><stop offset="1" stop-color="#FBBF24" stop-opacity=".55"/></linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".95"/><stop offset=".5" stop-color="#ffffff" stop-opacity=".35"/><stop offset="1" stop-color="#ffffff" stop-opacity=".7"/></linearGradient>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="13"/></filter>
    <filter id="drop" x="-25%" y="-25%" width="150%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="11" flood-color="#1b2f6b" flood-opacity=".2"/></filter>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0b1640" flood-opacity=".34"/></filter>
    <mask id="m" maskUnits="userSpaceOnUse" x="0" y="0" width="256" height="256"><path d="M76 160 A66 66 0 1 1 156 160 Q148 172 148 184 H84 Q84 172 76 160 Z" fill="#fff"/><rect x="84" y="192" width="64" height="30" rx="13" fill="#fff"/></mask>
    <g id="back"><circle cx="160" cy="88" r="58" fill="url(#g-yellow)"/></g>
  </defs>
<g filter="url(#drop)"><g>
    <use href="#back"/>
    <g mask="url(#m)"><use href="#back" filter="url(#blur)" opacity=".85"/><rect x="-64" y="-64" width="384" height="384" fill="url(#frost)"/></g>
    <path d="M76 160 A66 66 0 1 1 156 160 Q148 172 148 184 H84 Q84 172 76 160 Z" fill="none" stroke="url(#rim)" stroke-width="3.5"/><rect x="84" y="192" width="64" height="30" rx="13" fill="none" stroke="url(#rim)" stroke-width="3.5"/>
    <g filter="url(#lift)" opacity=".96"><path d="M98 140 Q107 116 116 140 Q125 164 134 140" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><path d="M98 207 H134" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></g>
  </g></g>
</svg>
