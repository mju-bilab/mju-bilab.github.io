<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
<title>Blue Spot — Q&amp;A · 퀴즈</title>
<defs><linearGradient id="g-violet" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ab8af9"/><stop offset="1" stop-color="#7c54e0"/></linearGradient>
    <linearGradient id="frost" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".7"/><stop offset=".6" stop-color="#bfa5fa" stop-opacity=".5"/><stop offset="1" stop-color="#8B5CF6" stop-opacity=".55"/></linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".95"/><stop offset=".5" stop-color="#ffffff" stop-opacity=".35"/><stop offset="1" stop-color="#ffffff" stop-opacity=".7"/></linearGradient>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="13"/></filter>
    <filter id="drop" x="-25%" y="-25%" width="150%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="11" flood-color="#1b2f6b" flood-opacity=".2"/></filter>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0b1640" flood-opacity=".34"/></filter>
    <mask id="m" maskUnits="userSpaceOnUse" x="0" y="0" width="256" height="256"><rect x="34" y="40" width="176" height="154" rx="48" fill="#fff"/><path d="M70 184 L54 228 L124 190 Z" fill="#fff"/></mask>
    <g id="back"><circle cx="184" cy="62" r="40" fill="url(#g-violet)"/></g>
  </defs>
<g filter="url(#drop)"><g>
    <use href="#back"/>
    <g mask="url(#m)"><use href="#back" filter="url(#blur)" opacity=".85"/><rect x="-64" y="-64" width="384" height="384" fill="url(#frost)"/></g>
    <rect x="34" y="40" width="176" height="154" rx="48" fill="none" stroke="url(#rim)" stroke-width="3.5"/><path d="M70 184 L54 228 L124 190 Z" fill="none" stroke="url(#rim)" stroke-width="3.5"/>
    <g filter="url(#lift)" opacity=".96"><path d="M98 96 Q98 68 124 68 Q150 68 150 94 Q150 114 124 122 V136" fill="none" stroke="#ffffff" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/><circle cx="124" cy="166" r="11" fill="#ffffff"/></g>
  </g></g>
</svg>
