<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
<title>Blue Spot — 제조 · 산업</title>
<defs><linearGradient id="g-sky" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#70cffa"/><stop offset="1" stop-color="#33a9e2"/></linearGradient><linearGradient id="g-navy" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#807aec"/><stop offset="1" stop-color="#4740d1"/></linearGradient>
    <linearGradient id="frost" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".7"/><stop offset=".6" stop-color="#9e99f1" stop-opacity=".5"/><stop offset="1" stop-color="#4F46E5" stop-opacity=".55"/></linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".95"/><stop offset=".5" stop-color="#ffffff" stop-opacity=".35"/><stop offset="1" stop-color="#ffffff" stop-opacity=".7"/></linearGradient>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="13"/></filter>
    <filter id="drop" x="-25%" y="-25%" width="150%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="11" flood-color="#1b2f6b" flood-opacity=".2"/></filter>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0b1640" flood-opacity=".34"/></filter>
    <mask id="m" maskUnits="userSpaceOnUse" x="0" y="0" width="256" height="256"><path d="M28 222 V118 L86 152 V118 L144 152 V100 H228 V222 Z" fill="#fff" stroke="#fff" stroke-width="10" stroke-linejoin="round"/></mask>
    <g id="back"><circle cx="204" cy="34" r="16" fill="url(#g-sky)"/><rect x="172" y="48" width="34" height="90" rx="10" fill="url(#g-navy)"/></g>
  </defs>
<g filter="url(#drop)"><g>
    <use href="#back"/>
    <g mask="url(#m)"><use href="#back" filter="url(#blur)" opacity=".85"/><rect x="-64" y="-64" width="384" height="384" fill="url(#frost)"/></g>
    <path d="M28 222 V118 L86 152 V118 L144 152 V100 H228 V222 Z" fill="none" stroke="url(#rim)" stroke-width="3.5" stroke-linejoin="round"/>
    <g filter="url(#lift)" opacity=".96"><rect x="52" y="176" width="26" height="22" rx="7" fill="#ffffff"/><rect x="100" y="176" width="26" height="22" rx="7" fill="#ffffff"/><rect x="148" y="176" width="26" height="22" rx="7" fill="#ffffff"/><rect x="192" y="176" width="20" height="22" rx="7" fill="#ffffff"/></g>
  </g></g>
</svg>
