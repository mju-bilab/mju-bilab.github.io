    <mask id="m" maskUnits="userSpaceOnUse" x="0" y="0" width="256" height="256"><path d="M128.0 44.0 L146.8 88.1 L194.6 92.4 L158.4 123.9 L169.1 170.6 L128.0 146.0 L86.9 170.6 L97.6 123.9 L61.4 92.4 L109.2 88.1 Z" fill="#fff" stroke="#fff" stroke-width="12" stroke-linejoin="round"/></mask>
