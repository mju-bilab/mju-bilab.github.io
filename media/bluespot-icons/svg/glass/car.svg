    <mask id="m" maskUnits="userSpaceOnUse" x="0" y="0" width="256" height="256"><path d="M30 168 V140 Q30 124 48 120 L74 80 Q82 66 100 66 H156 Q174 66 182 80 L208 120 Q226 124 226 140 V168 Q226 180 214 180 H42 Q30 180 30 168 Z" fill="#fff"/></mask>
    <g id="back"><circle cx="80" cy="182" r="28" fill="url(#g-navy)"/><circle cx="176" cy="182" r="28" fill="url(#g-navy)"/></g>
  </defs>
<g filter="url(#drop)"><g>
    <use href="#back"/>
    <g mask="url(#m)"><use href="#back" filter="url(#blur)" opacity=".85"/><rect x="-64" y="-64" width="384" height="384" fill="url(#frost)"/></g>
