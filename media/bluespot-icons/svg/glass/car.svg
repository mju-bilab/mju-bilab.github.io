    <g filter="url(#lift)" opacity=".96"><path d="M88 116 L104 88 H124 V116 Z" fill="#ffffff"/><path d="M136 88 H152 L168 116 H136 Z" fill="#ffffff"/><circle cx="52" cy="146" r="8" fill="#ffffff"/><circle cx="204" cy="146" r="8" fill="#ffffff"/></g>
  </g></g>
