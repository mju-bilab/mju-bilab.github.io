<body data-page="bluespot">

<div id="site-header"></div>

<main>
  <section class="pagehero bs-hero">
    <canvas class="hero-canvas" aria-hidden="true"></canvas>
    <div class="wrap">
      <span class="eyebrow">Magazine</span>
      <h1>Blue Spot</h1>
      <p>소비자 경험 데이터를 분석해 매주 산업별 리포트와 카드뉴스로 발행합니다</p>
    </div>
  </section>

  <section>
    <div class="wrap">
      <div class="pub-tabs insight-tabs" role="tablist" aria-label="콘텐츠 종류">
        <button type="button" class="pub-tab active" role="tab" data-target="report" aria-selected="true">리포트</button>
        <button type="button" class="pub-tab" role="tab" data-target="cardnews" aria-selected="false">카드뉴스</button>
      </div>

      <div data-insight-group="report" role="tabpanel">
        <div class="section-head">
          <span class="eyebrow">Report</span>
          <h2>주간 리포트</h2>
          <p>이번 주 리포트를 먼저 보여 드리고, 지난 리포트는 키워드로 골라 볼 수 있습니다</p>
        </div>
        <div class="rp-list" id="reportList"></div>
      </div>

      <div data-insight-group="cardnews" role="tabpanel" hidden>
        <div class="section-head">
          <span class="eyebrow">Card News</span>
          <h2>주간 카드뉴스</h2>
          <p>카드를 누르면 슬라이드로 넘겨 볼 수 있습니다</p>
        </div>
        <div class="cardnews-grid" id="cardnewsGrid"></div>
      </div>
    </div>
  </section>
</main>
